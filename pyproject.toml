[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rednote-scraper"
version = "1.0.0"
description = "Browserless CLI scraper for RedNote (Xiaohongshu) search results"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
requires-python = ">=3.11"
dependencies = ["httpx[http2]>=0.27"]

[project.urls]
Repository = "https://github.com/Kavun-Sama/rednote-scraper"
Issues = "https://github.com/Kavun-Sama/rednote-scraper/issues"

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8"]

[project.scripts]
rednote = "rednote_scraper.cli:main"

[tool.setuptools]
packages = ["rednote_scraper"]
