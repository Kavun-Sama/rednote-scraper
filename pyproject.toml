[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rednote-scraper"
version = "1.0.0"
description = "Fast browserless CLI scraper for rednote.com search results"
requires-python = ">=3.11"
dependencies = ["httpx[http2]>=0.27"]

[project.optional-dependencies]
browser = ["playwright>=1.44"]

[project.scripts]
rednote = "rednote_scraper.cli:main"

[tool.setuptools]
packages = ["rednote_scraper"]
